name: sentinelapi

services:
  sentinelapi-postgres:
    image: postgres:17-alpine
    container_name: sentinelapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinelapi_db}
      POSTGRES_USER: ${POSTGRES_USER:-sentinelapi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinelapi_dev_pass}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - sentinelapi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinelapi_user} -d ${POSTGRES_DB:-sentinelapi_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  sentinelapi_postgres_data:
    name: sentinelapi_postgres_data
